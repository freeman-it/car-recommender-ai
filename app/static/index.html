<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Recommender AI - 智能购车推荐</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>Car Recommender AI</h1>
      <p>回答几个问题，AI 帮你快速锁定最适合你的车型</p>
    </div>
  </header>

  <main class="container">
    <!-- 问卷表单 -->
    <section id="form-section" class="card form-card">
      <h2>购车需求问卷</h2>
      <form id="questionnaire-form" novalidate>
        <div class="form-group">
          <label for="budget_min">购车预算（万元）</label>
          <div class="budget-row">
            <input type="number" id="budget_min" min="0" step="0.1" value="10" required>
            <span class="separator">至</span>
            <input type="number" id="budget_max" min="1" step="0.1" value="20" required>
          </div>
          <p class="hint" id="budget-tip">建议下限不高于上限，相差越大可选车型越多</p>
        </div>

        <div class="form-group">
          <label>可接受的能源类型</label>
          <div class="chip-group" id="energy-group">
            <label class="chip"><input type="checkbox" name="energy" value="燃油"><span>燃油</span></label>
            <label class="chip"><input type="checkbox" name="energy" value="混动" checked><span>混动</span></label>
            <label class="chip"><input type="checkbox" name="energy" value="纯电"><span>纯电</span></label>
          </div>
          <p class="hint">不选表示不限能源类型</p>
        </div>

        <div class="form-group">
          <label>主要用车场景</label>
          <div class="chip-group">
            <label class="chip"><input type="radio" name="purpose" value="通勤代步" checked><span>通勤代步</span></label>
            <label class="chip"><input type="radio" name="purpose" value="家庭用车"><span>家庭用车</span></label>
            <label class="chip"><input type="radio" name="purpose" value="商务出行"><span>商务出行</span></label>
            <label class="chip"><input type="radio" name="purpose" value="运动操控"><span>运动操控</span></label>
            <label class="chip"><input type="radio" name="purpose" value="越野旅行"><span>越野旅行</span></label>
          </div>
        </div>

        <div class="form-group">
          <label for="seats">所需座位数</label>
          <div class="slider-row">
            <input type="range" id="seats" min="2" max="9" step="1" value="5">
            <span class="slider-value" id="seats-value">5 座</span>
          </div>
        </div>

        <div class="form-group">
          <label>偏好品牌（可多选）</label>
          <div class="chip-group" id="brand-group">
            <span class="hint">加载中...</span>
          </div>
        </div>

        <div class="form-group">
          <label>最看重的方面</label>
          <div class="chip-group">
            <label class="chip"><input type="radio" name="priority" value="综合" checked><span>综合</span></label>
            <label class="chip"><input type="radio" name="priority" value="空间"><span>空间</span></label>
            <label class="chip"><input type="radio" name="priority" value="动力"><span>动力</span></label>
            <label class="chip"><input type="radio" name="priority" value="经济性"><span>经济性</span></label>
            <label class="chip"><input type="radio" name="priority" value="智能科技"><span>智能科技</span></label>
            <label class="chip"><input type="radio" name="priority" value="安全"><span>安全</span></label>
            <label class="chip"><input type="radio" name="priority" value="保值率"><span>保值率</span></label>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submit-btn">
          <span class="btn-text">生成推荐方案</span>
        </button>
        <p class="form-error" id="form-error"></p>
      </form>
    </section>

    <!-- 推荐结果 -->
    <section id="result-section" class="card result-card" hidden>
      <div class="result-header">
        <h2>为你推荐的车型</h2>
        <button type="button" class="btn-secondary" id="reset-btn">重新填写</button>
      </div>
      <div id="advice-box" class="advice-box" hidden></div>
      <div id="result-list" class="result-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Car Recommender AI · 问卷推荐算法 + 可选 LLM 增强</p>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
