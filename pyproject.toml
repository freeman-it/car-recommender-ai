[project]
name = "car-recommender-ai"
version = "0.1.0"
description = "Car Recommender AI 智能购车推荐系统"
readme = "README.md"
authors = [
    { name = "徐志明", email = "17789620826@189.cn" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
